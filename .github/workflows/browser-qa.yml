name: Browser visual and interaction QA
on:
  push:
    branches: [qa/browser-review-20261028]
    paths-ignore: ['qa-results/**', 'README.md']
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Chromium and Korean fonts
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Serve review branch
        run: python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/portfolio-server.log 2>&1 &
      - name: Inspect review branch in Chromium
        env:
          QA_BASE_URL: http://127.0.0.1:8000/
        run: xvfb-run -a node tests/browser-qa.cjs
      - name: Save review evidence on QA branch
        if: always()
        run: |
          if [ -d qa-results ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add qa-results
            git diff --cached --quiet || git commit -m "Record browser QA screenshots and results [skip ci]"
            git push origin HEAD:qa/browser-review-20261028
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: qa-results/
          retention-days: 7
